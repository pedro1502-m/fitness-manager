<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fitness Manager - Entrar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <button id="theme-toggle" class="icon-btn theme-float" aria-label="Alternar tema">🌙</button>

  <main class="auth-card">
    <header class="auth-header">
      <div class="logo">💪</div>
      <h1>Fitness Manager</h1>
      <p class="muted">Treinos, dieta e evolução em um só lugar.</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="login" role="tab">Entrar</button>
      <button class="tab" data-tab="register" role="tab">Cadastrar</button>
    </div>

    <form id="login-form" class="form" novalidate>
      <label class="field"><span>E-mail</span>
        <input type="email" name="email" autocomplete="email" required placeholder="voce@email.com" />
      </label>
      <label class="field"><span>Senha</span>
        <input type="password" name="password" autocomplete="current-password" required placeholder="••••••" />
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button type="submit" class="btn primary block">Entrar</button>
    </form>

    <form id="register-form" class="form hidden" novalidate>
      <label class="field"><span>Nome</span>
        <input type="text" name="name" autocomplete="name" required placeholder="Seu nome" />
      </label>
      <label class="field"><span>E-mail</span>
        <input type="email" name="email" autocomplete="email" required placeholder="voce@email.com" />
      </label>
      <label class="field"><span>Senha (mín. 6 caracteres)</span>
        <input type="password" name="password" autocomplete="new-password" minlength="6" required />
      </label>
      <p class="form-error" id="register-error" role="alert"></p>
      <button type="submit" class="btn primary block">Criar conta</button>
    </form>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
